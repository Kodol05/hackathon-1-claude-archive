<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동아리 활동 기록 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>동아리 활동 기록 관리</h1>

  <main>
    <section aria-labelledby="formHeading">
      <h2 id="formHeading">활동 등록</h2>
      <form id="activityForm" class="activity-form" novalidate>
        <label for="titleInput">활동명</label>
        <input type="text" id="titleInput" placeholder="예) 정기 모임">

        <label for="dateInput">날짜</label>
        <input type="date" id="dateInput">

        <label for="placeInput">장소</label>
        <input type="text" id="placeInput" placeholder="예) 학생회관 201호">

        <label for="memberCountInput">참여 인원</label>
        <input type="number" id="memberCountInput" min="1" step="1" placeholder="1">

        <label for="memoInput">메모</label>
        <textarea id="memoInput" rows="3"></textarea>

        <p id="formError" class="form-error" role="alert" hidden></p>
        <button type="submit" class="submit-button">등록</button>
      </form>
    </section>

    <section aria-labelledby="listHeading">
      <h2 id="listHeading">활동 목록</h2>

      <div class="filter-row">
        <label for="startDateInput">시작일</label>
        <input type="date" id="startDateInput">
        <label for="endDateInput">종료일</label>
        <input type="date" id="endDateInput">
        <button type="button" id="resetFilterButton" class="reset-button">초기화</button>
      </div>

      <ul id="activityList" class="activity-list" aria-live="polite"></ul>
      <p id="emptyMessage" class="empty-message" hidden>등록된 활동이 없습니다. 첫 활동을 등록해보세요.</p>
    </section>
    <!-- ===== 회원·팀 관리 (담당: 김현민) =====
         이 주석 안에 아래 요소를 만든다. 다른 사람 구역은 건드리지 않는다.
         - <form id="teamForm">   : 팀 이름(teamNameInput), 권장 정원(teamCapacityInput)
         - <form id="memberForm"> : 회원 이름(memberNameInput), 직군(memberRoleSelect),
                                    소속 팀(memberTeamSelect, 미배정 가능)
         - <div id="teamList">    : 팀 카드 목록. 정원 초과 시 "정원 +N명" 배지
         - <p id="teamEmptyMessage"> : 등록된 팀이 없을 때 안내
    -->
    <section aria-labelledby="teamHeading">
      <h2 id="teamHeading">회원·팀 관리</h2>

      <div class="form-row">
        <form id="teamForm" class="activity-form" novalidate>
          <h3 class="form-title">팀 등록</h3>

          <label for="teamNameInput">팀 이름</label>
          <input type="text" id="teamNameInput" placeholder="예) 알파팀">

          <label for="teamCapacityInput">권장 정원</label>
          <input type="number" id="teamCapacityInput" min="1" step="1" placeholder="5">

          <p id="teamFormError" class="form-error" role="alert" hidden></p>
          <button type="submit" class="submit-button">팀 등록</button>
        </form>

        <form id="memberForm" class="activity-form" novalidate>
          <h3 class="form-title">회원 등록</h3>

          <label for="memberNameInput">회원 이름</label>
          <input type="text" id="memberNameInput" placeholder="예) 홍길동">

          <label for="memberRoleSelect">직군</label>
          <select id="memberRoleSelect">
            <option value="planning">기획</option>
            <option value="programming">프로그래밍</option>
            <option value="art">아트</option>
            <option value="sound">사운드</option>
            <option value="other">기타</option>
          </select>

          <label for="memberTeamSelect">소속 팀</label>
          <select id="memberTeamSelect">
            <option value="">미배정</option>
          </select>

          <p id="memberFormError" class="form-error" role="alert" hidden></p>
          <button type="submit" class="submit-button">회원 등록</button>
        </form>
      </div>

      <div id="teamList" class="team-list"></div>
      <p id="teamEmptyMessage" class="empty-message" hidden>등록된 팀이 없습니다. 팀과 회원을 먼저 등록해보세요.</p>
    </section>


    <!-- ===== 일정 관리 (담당: 이정호) =====
         이 주석 안에 아래 요소를 만든다. 다른 사람 구역은 건드리지 않는다.
         - <form id="scheduleForm"> : 일정명(scheduleTitleInput), 날짜(scheduleDateInput),
                                      구분(scheduleCategorySelect: 해커톤/축제/정기활동/기타),
                                      장소(schedulePlaceInput), 메모(scheduleMemoInput)
         - <ul id="scheduleList">   : D-day 가까운 순 일정 목록
         - <p id="scheduleEmptyMessage"> : 등록된 일정이 없을 때 안내
    -->


    <section aria-labelledby="chartHeading">
      <h2 id="chartHeading">월별 활동 횟수</h2>
      <div class="chart-box">
        <canvas id="monthlyChart"></canvas>
      </div>
      <p id="chartEmptyMessage" class="empty-message" hidden>표시할 통계가 없습니다.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
